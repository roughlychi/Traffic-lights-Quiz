<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신호등 Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;--ink:#1b1f27;--sub:#6b7480;--orange:#FF8A1F;--peach:#FFF1E1;--peachline:#FFB366;--card:#F3F5F8;--grey:#B9C1CC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;word-break:keep-all}
.wrap{max-width:480px;margin:0 auto;padding:28px 20px;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.label{font-size:.88rem;font-weight:700;color:var(--orange)}
.count{font-size:.85rem;color:#98a1ad;letter-spacing:.04em}
h2{margin:0;font-size:1.6rem;font-weight:400;line-height:1.4;letter-spacing:-.03em}
h2 b{position:relative;z-index:0;font-weight:800;padding:0 .1em}
h2 b::before{content:"";position:absolute;left:0;right:0;bottom:-.05em;height:.52em;background:#FFC470;transform:skewX(-20deg);z-index:-1}
.sub{margin:12px 0 22px;color:var(--sub);font-size:.88rem}
.scene{width:100%;margin:0 0 26px;aspect-ratio:900/520;background:#eceff4}
.scene svg{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:12px;width:100%}
.opt{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-size:1rem;font-weight:500;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid #E4E9F0;border-radius:40px;padding:14px 20px 14px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,border-color .15s,box-shadow .15s,color .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.opt.ok{color:#E65C00;font-weight:700;background:linear-gradient(135deg,var(--peach),#FFE6C9);border-color:#F8A860;box-shadow:0 4px 12px rgba(255,138,31,.18)}
.opt.no{color:#5a6472;font-weight:700;background:linear-gradient(135deg,#EFF1F5,#E2E6EC);border-color:#B9C1CC;box-shadow:0 4px 12px rgba(107,116,128,.16)}
.ico{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:#8a94a2;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.ico.ok{background:var(--orange)}
.ico.no{background:var(--grey)}
.ico.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.gobar{position:sticky;bottom:0;max-width:480px;margin:0 auto;padding:18px 20px 14px;background:linear-gradient(rgba(255,255,255,0),#fff 38%)}
.go{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;font:inherit;font-size:1.05rem;font-weight:700;color:#fff;background:var(--orange);border:0;border-radius:40px;padding:16px;cursor:pointer;box-shadow:0 6px 14px rgba(255,138,31,.28);-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .1s}
.go:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.ico.pop{animation:none}.opt,.go{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.result{text-align:center;padding:56px 0 12px;min-height:calc(100vh - 230px);min-height:calc(100svh - 230px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.result .big{font-size:3.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.result .big span{color:var(--orange)}
.result p{margin:10px 0 0;color:var(--sub)}
.result .small{font-size:.82rem;color:#98a1ad}
</style>
</head>

297\" cy=\"54\" rx=\"10\" ry=\"6\" fill=\"#fff\" opacity=\".5\"/><rect x=\"72\" y=\"-14\" width=\"14\" height=\"16\" fill=\"#3e4750\"/><rect x=\"270\" y=\"-14\" width=\"14\" height=\"16\" fill=\"#3e4750\"/></g>\n</svg>"}];
const TOTAL=QUIZ.length;
const LABEL={O:'진로 방향으로 진행한다.',C:'전방을 살피며 조건부 진행한다.',X:'진행 불가이므로 정지한다.'};
const IC={ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',no:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
const $=id=>document.getElementById(id);
let order,n,first,mode;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(QUIZ.map((_,k)=>k));n=0;first={};mode='quiz';show()}
function show(){
  const q=QUIZ[order[n]];
  $('count').textContent=`${n+1}/${TOTAL}`;
  $('gotxt').textContent=n===TOTAL-1?'결과 보기':'다음 문제';
  $('card').innerHTML=`<h2>나는 <b>${q.dir}</b>을 하려고 합니다</h2>
  <p class="sub">신호와 도로 상황을 보고 진행 가능 여부를 고르세요.</p>
  <div class="scene" role="img" aria-label="교차로 앞 신호기와 도로 상황 일러스트">${q.svg}</div>
  <div class="opts">${Object.entries(LABEL).map(([k,t],i)=>`<button class="opt" data-k="${k}" data-l="${'ABC'[i]}"><span class="ico">${'ABC'[i]}</span>${t}</button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
  window.scrollTo(0,0);
}
function pick(b){
  document.querySelectorAll('.opt').forEach(o=>{o.classList.remove('ok','no');const c=o.querySelector('.ico');c.className='ico';c.textContent=o.dataset.l});
  const q=QUIZ[order[n]],right=b.dataset.k===q.ans,c=b.querySelector('.ico');
  first[q.id]=right;
  b.classList.add(right?'ok':'no');
  c.className='ico pop '+(right?'ok':'no');c.innerHTML=right?IC.ok:IC.no;
  $('sr').textContent=right?'정답입니다':'틀렸습니다';
}
function end(){
  mode='result';
  const score=Object.values(first).filter(Boolean).length,rate=score/TOTAL;
  $('count').textContent='결과';
  $('gotxt').textContent='다시 풀기';
  $('card').innerHTML=`<div class="result"><div class="big"><span>${score}</span>/${TOTAL}</div><p>${rate>=.9?'완벽해요! 신호는 이제 걱정 없어요.':rate>=.7?'잘하고 있어요! 틀린 유형만 한 번 더 확인해 보세요.':'조금만 더 연습하면 금방 늘어요. 다시 도전해 볼까요?'}</p><p class="small">마지막에 고른 답 기준이에요. 풀지 않고 넘긴 문제는 틀린 것으로 계산돼요.</p></div>`;
  window.scrollTo(0,0);
}
$('nx').onclick=()=>{if(mode==='result')return start();if(n===TOTAL-1)return end();n++;show()};
start();
</script>
